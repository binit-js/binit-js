name: Contribution Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/snake.svg?color_snake=0285FF&color_dots=#ebedf0,#c6e48b,#7bc96f,#239a3b,#196127
            output/snake-dark.svg?palette=github-dark&color_snake=0285FF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: output
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
