name: Charts and Cards
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python scripts/radar.py --data assets/skills.json -o assets/radar
      - run: python scripts/radar.py --github "${{ github.repository_owner }}" -o assets/radar-langs --limit 7 --values --curve 0.4 --exclude "shell,makefile,dockerfile,batchfile,procfile"
      - run: python scripts/cards.py --user "${{ github.repository_owner }}" --out assets
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh charts and cards"
          git push
